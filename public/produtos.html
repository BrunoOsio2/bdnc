<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de produtos</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #000000;
      font-size: 18px;
      margin: 40px;
    }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p { margin: 0 0 20px; }
    .nav { margin-bottom: 20px; }
    .nav a { margin-right: 16px; }
    button {
      padding: 10px 18px;
      font-size: 18px;
      border: 1px solid #000;
      background: #f2f2f2;
      cursor: pointer;
      margin-bottom: 16px;
    }
    #status { margin: 12px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 18px; }
    th, td { border: 1px solid #999; padding: 10px 12px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    td.num { text-align: right; white-space: nowrap; }
    td.center { text-align: center; }
  </style>
</head>
<body>
  <h1>Lista de produtos</h1>
  <p>Produtos cadastrados no banco relacional (tabela <strong>produto</strong>).</p>

  <div class="nav">
    <a href="/">Busca por similaridade</a>
    <a href="/produtos.html">Lista de produtos</a>
    <a href="/novo-produto.html">Adicionar produto</a>
  </div>

  <button id="recarregar">Recarregar</button>

  <div id="status"></div>

  <table id="tabela" style="display:none">
    <thead>
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Classe</th>
        <th>Preço</th>
        <th>Ativo</th>
        <th>Vetorizado</th>
      </tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>

  <script>
    var status = document.getElementById('status');
    var tabela = document.getElementById('tabela');
    var corpo = document.getElementById('corpo');

    function carregar() {
      status.textContent = 'Carregando...';
      tabela.style.display = 'none';
      corpo.innerHTML = '';
      fetch('/api/v1/produto')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.NumMens !== 0) { status.textContent = 'Erro: ' + data.Mensagem; return; }
          var itens = data.dados || [];
          status.textContent = itens.length + ' produto(s) cadastrado(s)';
          corpo.innerHTML = itens.map(linha).join('');
          tabela.style.display = itens.length ? 'table' : 'none';
        })
        .catch(function (e) { status.textContent = 'Falha na requisicao: ' + e.message; });
    }

    function linha(p) {
      var preco = Number(p.preco).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      return '<tr>' +
        '<td class="num">' + p.id_produto + '</td>' +
        '<td>' + p.nome + '</td>' +
        '<td>' + (p.descricao || '') + '</td>' +
        '<td>' + p.classe + '</td>' +
        '<td class="num">' + preco + '</td>' +
        '<td class="center">' + (p.ativo ? 'Sim' : 'Não') + '</td>' +
        '<td class="center">' + (p.vetorizado ? 'Sim' : 'Não') + '</td>' +
        '</tr>';
    }

    document.getElementById('recarregar').addEventListener('click', carregar);
    carregar();
  </script>
</body>
</html>
